name: Scheduled episode publish

# Lists pre-staged episodes (pages already on the site, unlisted) into the live
# catalogue + search-index on their release date, evaluated in Australia/Sydney
# local time. Once listed they appear in All Episodes, search, and Choose-Your-Own-
# Adventure. Idempotent. Platform links (Spotify/Apple) are backfilled separately.
#
# Cron runs at 15:00 and 16:00 UTC daily = ~1am Sydney (1am AEST winter / 2am AEDT
# summer) — deliberately ~1hr AFTER the midnight YouTube/Spotify release so the
# platforms have finished going live before the website lists the episode. promote.py
# checks the real Sydney date; the second run is an idempotent retry (no double-publish).
#
# IMPORTANT (why this workflow deploys Pages itself): a commit pushed with the
# built-in GITHUB_TOKEN does NOT trigger other workflows (GitHub loop-prevention),
# so the separate `deploy-pages.yml` (on: push) never ran for the bot's commit and
# EP 288's scheduled listing sat on origin/main without deploying (3 Aug 2026). The
# `deploy` job below deploys the updated site in-run, so publishing is self-contained.

on:
  schedule:
    - cron: '0 15,16 * * *'
  workflow_dispatch:
    inputs:
      test_today:
        description: 'Override Sydney date (YYYY-MM-DD) for a dry test. Blank = real today.'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.commit.outputs.published }}
    steps:
      - name: Checkout main (the live site + data)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout scheduled branch (schedule + deltas + promote script)
        uses: actions/checkout@v5
        with:
          ref: scheduled
          path: _sched_src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Promote any episodes due today (Sydney)
        env:
          TEST_TODAY: ${{ github.event.inputs.test_today }}
          REPO_DIR: '.'
          SCHED_DIR: '_sched_src/_schedule'
        run: python3 _sched_src/_schedule/promote.py

      - name: Commit + push if an episode went live
        id: commit
        run: |
          if [ -n "$(git status --porcelain data/catalogue.json data/search-index.json)" ]; then
            git config user.name "tng-scheduler[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add -- data/catalogue.json data/search-index.json
            git commit -m "Scheduled publish: list due episode(s) in catalogue + search-index"
            git push origin main
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Published — the deploy job will now redeploy the site."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Nothing due today; no changes."
          fi

  # Deploy the freshly-listed site. Runs only when the promote job published
  # something. Self-contained (does NOT rely on deploy-pages.yml's push trigger,
  # which a GITHUB_TOKEN commit cannot fire). Mirrors deploy-pages.yml exactly.
  deploy:
    needs: promote
    if: needs.promote.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout main (now updated by promote)
        uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (retry after transient failure)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
